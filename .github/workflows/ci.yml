name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        buildtype: [Debug, Release]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: install zlib
        run: sudo apt-get update -q && sudo apt-get install -y -q zlib1g-dev
      - name: configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.buildtype }}
      - name: build
        run: cmake --build build
      - name: test
        run: ctest --test-dir build --output-on-failure
      - name: smoke test
        run: |
          ./build/c-http-example -p 8080 -b localhost &
          SERVER_PID=$!
          sleep 1
          curl -sf -o /dev/null http://127.0.0.1:8080/
          kill $SERVER_PID

  amalgamate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install zlib + python3
        run: sudo apt-get update -q && sudo apt-get install -y -q zlib1g-dev python3
      - name: generate single-header
        run: python3 scripts/amalgamate.py --output c_http_single.h
      - name: verify single-header compiles
        run: |
          cat > /tmp/test.c << 'EOF'
          #define C_HTTP_IMPLEMENTATION
          #include "c_http_single.h"
          int main(void) { return 0; }
          EOF
          cc -DNDEBUG -O2 -I. /tmp/test.c -lz -o /tmp/test && /tmp/test

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: install clang-format
        run: sudo apt-get update -q && sudo apt-get install -y -q clang-format
      - name: configure
        run: cmake -S . -B build
      - name: check formatting
        run: cmake --build build -t format-check